services:
  mysql:
    image: mysql:8.0
    container_name: contact_center_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: contact_center_db
      MYSQL_USER: contact_center_user
      MYSQL_PASSWORD: contact_center_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: contact_center_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer
    container_name: contact_center_adminer
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build: .
    container_name: contact_center_api
    env_file:
      - .env.docker
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    command: ["python", "main.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  webhook:
    build: .
    container_name: contact_center_webhook
    env_file:
      - .env.docker
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./:/app
    command: ["python", "webhook_listener.py"]

volumes:
  mysql_data:
  redis_data:
